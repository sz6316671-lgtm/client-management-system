{% extends "base.html" %}

{% block title %}Add Client - SysZenix CRM{% endblock %}

{% block content %}
<div class="container-fluid px-3 py-3">
    <!-- Header Section -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1 text-dark">Add New Client</h4>
            <p class="text-muted small mb-0">Onboard a new client into your CRM directory.</p>
        </div>
        <a href="/manage-client" class="btn btn-light text-secondary border px-3 py-2 fw-medium shadow-sm" style="border-radius: 10px;">
            <i class="bi bi-arrow-left me-1"></i> Back to Clients
        </a>
    </div>
    
    <!-- Form Card -->
    <div class="card border border-light shadow-sm p-4 bg-white" style="border-radius: 14px;">
        <form action="/add-client" method="POST">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small">Client Name *</label>
                    <input type="text" class="form-control bg-light border-0 py-2" name="name" required placeholder="Enter full name" style="border-radius: 10px;">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small">Email Address</label>
                    <input type="email" class="form-control bg-light border-0 py-2" name="email" placeholder="client@example.com" style="border-radius: 10px;">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small">Phone Number</label>
                    <input type="text" class="form-control bg-light border-0 py-2" name="phone" placeholder="+92 300 1234567" style="border-radius: 10px;">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small">Company Name</label>
                    <input type="text" class="form-control bg-light border-0 py-2" name="company" placeholder="Company Ltd." style="border-radius: 10px;">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small">Website</label>
                    <input type="text" class="form-control bg-light border-0 py-2" name="website" placeholder="https://example.com" style="border-radius: 10px;">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small">Status</label>
                    <select class="form-select bg-light border-0 py-2" name="status" style="border-radius: 10px;">
                        <option value="Active">Active</option>
                        <option value="Pending">Pending</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
            </div>

            <!-- Login Credentials Section -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small">Login Username *</label>
                    <input type="text" class="form-control bg-light border-0 py-2" name="username" placeholder="Login username" required style="border-radius: 10px;">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small">Login Password *</label>
                    <input type="password" class="form-control bg-light border-0 py-2" name="password" placeholder="Login password" required style="border-radius: 10px;">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary small">Services Provided</label>
                <textarea class="form-control bg-light border-0 py-2" name="services" rows="3" placeholder="e.g., Web Development, Mobile App, UI/UX" style="border-radius: 10px;"></textarea>
            </div>

            <div class="d-flex justify-content-end gap-2 border-top pt-3">
                <a href="/manage-client" class="btn btn-light px-4 py-2 fw-medium text-secondary" style="border-radius: 10px;">Cancel</a>
                <button type="submit" class="btn btn-dark px-4 py-2 fw-medium shadow-sm" style="border-radius: 10px;">
                    <i class="bi bi-save me-1"></i> Save Client
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
