{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-4 py-4" style="max-width: 1000px;">
    <!-- Header Section -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h3 class="fw-bold tracking-tight mb-1" style="letter-spacing: -0.03em;">Create New Invoice</h3>
            <p class="text-secondary small mb-0">Generate billing entry, select scope, and auto-sync budget parameters.</p>
        </div>
        <a href="{{ url_for('invoices.manage_invoices') }}" class="btn btn-light border px-3 py-2 fw-medium text-secondary" style="border-radius: 10px; font-size: 0.875rem;">
            <i class="bi bi-arrow-left me-1"></i> Back
        </a>
    </div>

    <!-- Form Card -->
    <div class="card border border-light shadow-sm p-4 bg-white" style="border-radius: 12px;">
        <form method="POST">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small">Select Client *</label>
                    <select name="client_id" id="client_select" class="form-select border-0 bg-light py-2" required onchange="fillClientProjectData()" style="border-radius: 10px; font-size: 0.875rem;">
                        <option value="" disabled selected>Choose client...</option>
                        {% for client in clients %}
                            <option value="{{ client[0] }}">{{ client[1] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small">Invoice Number *</label>
                    <input type="text" name="invoice_number" class="form-control border-0 bg-light py-2 font-monospace" value="{{ auto_invoice_number }}" required style="border-radius: 10px; font-size: 0.875rem;">
                </div>
            </div>

            <!-- Service Selection Fields -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small">Service Type *</label>
                    <select name="service_type" id="service_type" class="form-select border-0 bg-light py-2" required onchange="updateSubServices()" style="border-radius: 10px; font-size: 0.875rem;">
                        <option value="" disabled selected>Select service category...</option>
                        <option value="Website">Website</option>
                        <option value="Mobile App">Mobile App</option>
                        <option value="Custom Software">Custom Software</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small">Sub-Service / Technology *</label>
                    <select name="sub_service" id="sub_service" class="form-select border-0 bg-light py-2" required style="border-radius: 10px; font-size: 0.875rem;">
                        <option value="" disabled selected>First select a service type...</option>
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label fw-semibold text-secondary small">Amount ($) *</label>
                    <input type="number" step="0.01" name="amount" id="amount" class="form-control border-0 bg-light py-2 font-monospace" placeholder="0.00" required style="border-radius: 10px; font-size: 0.875rem;">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold text-secondary small">Status *</label>
                    <select name="status" class="form-select border-0 bg-light py-2" required style="border-radius: 10px; font-size: 0.875rem;">
                        <option value="Unpaid" selected>Unpaid</option>
                        <option value="Paid">Paid</option>
                        <option value="Partially Paid">Partially Paid</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold text-secondary small">Due Date</label>
                    <input type="date" name="due_date" class="form-control border-0 bg-light py-2 font-monospace" style="border-radius: 10px; font-size: 0.875rem;">
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 pt-2 border-top" style="border-color: rgba(0,0,0,0.05) !important;">
                <a href="{{ url_for('invoices.manage_invoices') }}" class="btn btn-light px-4 py-2 fw-medium text-secondary" style="border-radius: 10px; font-size: 0.875rem;">Cancel</a>
                <button type="submit" class="btn px-4 py-2 fw-medium text-white shadow-sm" style="background: #09090b; border-radius: 10px; font-size: 0.875rem;">
                    <i class="bi bi-save me-1"></i> Save Invoice
                </button>
            </div>
        </form>
    </div>
</div>

<!-- JavaScript for Dynamic Auto-fill & Sub-services -->
<script>
        const clientProjects = {
            {% for client in clients %}
                "{{ client[0] }}": {
                    "project_name": "{{ client[2] or '' }}",
                    "budget": "{{ client[3] or '' }}"
                },
            {% endfor %}
        };

        function updateSubServices(selectedSub = '') {
            const serviceType = document.getElementById('service_type').value;
            const subServiceDropdown = document.getElementById('sub_service');
            
            subServiceDropdown.innerHTML = '<option value="" disabled selected>Choose sub-service...</option>';

            let options = [];

            if (serviceType === 'Website') {
                options = ['WordPress', 'Shopify', 'Custom CRM', 'E-Commerce Store', 'Landing Page'];
            } else if (serviceType === 'Mobile App') {
                options = ['Flutter (Cross-Platform)', 'React Native', 'Android (Native)', 'iOS (Swift)'];
            } else if (serviceType === 'Custom Software') {
                options = ['Python / Flask / FastAPI', 'Node.js / NestJS', 'Desktop Software', 'API Integration'];
            }

            options.forEach(function(sub) {
                let opt = document.createElement('option');
                opt.value = sub;
                opt.innerHTML = sub;
                if (sub === selectedSub) {
                    opt.selected = true;
                }
                subServiceDropdown.appendChild(opt);
            });
        }

        function fillClientProjectData() {
            const clientId = document.getElementById('client_select').value;
            const projectData = clientProjects[clientId];

            if (projectData) {
                if (projectData.project_name) {
                    const matchedType = project_name_matcher(projectData.project_name);
                    document.getElementById('service_type').value = matchedType;
                    updateSubServices();
                }

                if (projectData.budget) {
                    document.getElementById('amount').value = projectData.budget;
                }
            }
        }

        function project_name_matcher(name) {
            const lowerName = name.toLowerCase();
            if (lowerName.includes('web')) return 'Website';
            if (lowerName.includes('mobile') || lowerName.includes('app')) return 'Mobile App';
            if (lowerName.includes('software') || lowerName.includes('custom')) return 'Custom Software';
            return name;
        }
    </script>
{% endblock %}
