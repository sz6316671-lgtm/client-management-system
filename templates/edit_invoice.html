{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-4 py-4" style="max-width: 1000px;">
    <!-- Header Section -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h3 class="fw-bold tracking-tight mb-1" style="letter-spacing: -0.03em;">Edit Invoice</h3>
            <p class="text-secondary small mb-0">Updating billing record <span class="font-monospace text-dark">#{{ invoice[2] }}</span>.</p>
        </div>
        <a href="{{ url_for('invoices.manage_invoices') }}" class="btn btn-light border px-3 py-2 fw-medium text-secondary" style="border-radius: 10px; font-size: 0.875rem;">
            <i class="bi bi-arrow-left me-1"></i> Back
        </a>
    </div>

    <!-- Form Card -->
    <div class="card border border-light shadow-sm p-4 bg-white" style="border-radius: 12px;">
        <form method="POST">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small">Select Client *</label>
                    <select name="client_id" class="form-select border-0 bg-light py-2" required style="border-radius: 10px; font-size: 0.875rem;">
                        {% for client in clients %}
                            <option value="{{ client[0] }}" {% if client[0]|string == invoice[1]|string %}selected{% endif %}>
                                {{ client[1] }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small">Invoice Number *</label>
                    <input type="text" name="invoice_number" class="form-control border-0 bg-light py-2 font-monospace" value="{{ invoice[2] }}" required style="border-radius: 10px; font-size: 0.875rem;">
                </div>
            </div>

            <!-- Service Type & Sub-Service Fields -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small">Service Type *</label>
                    <select name="service_type" id="service_type" class="form-select border-0 bg-light py-2" required onchange="updateSubServices()" style="border-radius: 10px; font-size: 0.875rem;">
                        <option value="" disabled>Select service category...</option>
                        <option value="Website" {% if invoice[6] == 'Website' %}selected{% endif %}>Website</option>
                        <option value="Mobile App" {% if invoice[6] == 'Mobile App' %}selected{% endif %}>Mobile App</option>
                        <option value="Custom Software" {% if invoice[6] == 'Custom Software' %}selected{% endif %}>Custom Software</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small">Sub-Service / Technology *</label>
                    <select name="sub_service" id="sub_service" class="form-select border-0 bg-light py-2" required style="border-radius: 10px; font-size: 0.875rem;">
                        <option value="" disabled selected>Choose sub-service...</option>
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label fw-semibold text-secondary small">Amount ($) *</label>
                    <input type="number" step="0.01" name="amount" class="form-control border-0 bg-light py-2 font-monospace" value="{{ invoice[3] }}" required style="border-radius: 10px; font-size: 0.875rem;">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold text-secondary small">Status *</label>
                    <select name="status" class="form-select border-0 bg-light py-2" required style="border-radius: 10px; font-size: 0.875rem;">
                        <option value="Unpaid" {% if invoice[4] == 'Unpaid' %}selected{% endif %}>Unpaid</option>
                        <option value="Paid" {% if invoice[4] == 'Paid' %}selected{% endif %}>Paid</option>
                        <option value="Partially Paid" {% if invoice[4] == 'Partially Paid' %}selected{% endif %}>Partially Paid</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold text-secondary small">Due Date</label>
                    <input type="date" name="due_date" class="form-control border-0 bg-light py-2 font-monospace" value="{{ invoice[5] or '' }}" style="border-radius: 10px; font-size: 0.875rem;">
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 pt-2 border-top" style="border-color: rgba(0,0,0,0.05) !important;">
                <a href="{{ url_for('invoices.manage_invoices') }}" class="btn btn-light px-4 py-2 fw-medium text-secondary" style="border-radius: 10px; font-size: 0.875rem;">Cancel</a>
                <button type="submit" class="btn px-4 py-2 fw-medium text-white shadow-sm" style="background: #09090b; border-radius: 10px; font-size: 0.875rem;">
                    <i class="bi bi-save me-1"></i> Update Invoice
                </button>
            </div>
        </form>
    </div>
</div>

<!-- JavaScript to handle dynamic sub-services and pre-selection on edit -->
<script>
    function updateSubServices(selectedSub = '') {
        const serviceType = document.getElementById('service_type').value;
        const subServiceDropdown = document.getElementById('sub_service');
        
        subServiceDropdown.innerHTML = '<option value="" disabled>Choose sub-service...</option>';

        let options = [];

        if (serviceType === 'Website') {
            options = ['WordPress', 'Shopify', 'Custom CRM', 'E-Commerce Store', 'Landing Page'];
        } else if (serviceType === 'Mobile App') {
            options = ['Flutter (Cross-Platform)', 'React Native', 'Android (Native)', 'iOS (Swift)'];
        } else if (serviceType === 'Custom Software') {
            options = ['Python / Flask / FastAPI', 'Node.js / NestJS', 'Desktop Software', 'API Integration'];
        }

        options.forEach(function(sub) {
            let opt = document.createElement('option');
            opt.value = sub;
            opt.innerHTML = sub;
            if (sub === selectedSub) {
                opt.selected = true;
            }
            subServiceDropdown.appendChild(opt);
        });
    }

    window.onload = function() {
        const currentService = "{{ invoice[6] or '' }}";
        const currentSubService = "{{ invoice[7] or '' }}";
        if (currentService) {
            document.getElementById('service_type').value = currentService;
            updateSubServices(currentSubService);
        }
    };
</script>
{% endblock %}
