{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-4 py-4" style="max-width: 800px;">
    <!-- Header Section -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h3 class="fw-bold tracking-tight mb-1" style="letter-spacing: -0.03em;">Edit User</h3>
            <p class="text-secondary small mb-0">Update account credentials and system role permissions for <span class="font-monospace text-dark">{{ user[1] }}</span>.</p>
        </div>
        <a href="{{ url_for('users.manage_users') }}" class="btn btn-light border px-3 py-2 fw-medium text-secondary" style="border-radius: 10px; font-size: 0.875rem;">
            <i class="bi bi-arrow-left me-1"></i> Back
        </a>
    </div>

    <!-- Form Card -->
    <div class="card border border-light shadow-sm p-4 bg-white" style="border-radius: 12px;">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small">Username *</label>
                <input type="text" name="username" value="{{ user[1] }}" class="form-control border-0 bg-light py-2" required style="border-radius: 10px; font-size: 0.875rem;">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small">New Password (Leave blank to keep current)</label>
                <input type="password" name="password" class="form-control border-0 bg-light py-2" placeholder="Enter new password if you want to change..." style="border-radius: 10px; font-size: 0.875rem;">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary small">Role *</label>
                <select name="role" class="form-select border-0 bg-light py-2" required style="border-radius: 10px; font-size: 0.875rem;">
                    <option value="admin" {% if user[2] == 'admin' %}selected{% endif %}>Admin</option>
                    <option value="client" {% if user[2] == 'client' %}selected{% endif %}>Client</option>
                </select>
            </div>

            <div class="d-flex justify-content-end gap-2 pt-2 border-top" style="border-color: rgba(0,0,0,0.05) !important;">
                <a href="{{ url_for('users.manage_users') }}" class="btn btn-light px-4 py-2 fw-medium text-secondary" style="border-radius: 10px; font-size: 0.875rem;">Cancel</a>
                <button type="submit" class="btn px-4 py-2 fw-medium text-white shadow-sm" style="background: #09090b; border-radius: 10px; font-size: 0.875rem;">
                    <i class="bi bi-save me-1"></i> Update User
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
