<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - {{ branding.company_name }}</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --bs-primary: #10b981;
            --bs-primary-rgb: 16, 185, 129;
        }
        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 16px;
            background: #fff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        }
        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.15);
        }
        .input-group-text {
            border-color: #dee2e6;
        }
        .btn-rizz {
            background-color: #10b981;
            border-color: #10b981;
            color: #fff;
            font-weight: 500;
            border-radius: 8px;
            transition: 0.2s;
        }
        .btn-rizz:hover {
            background-color: #059669;
            border-color: #059669;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            {% if branding.logo_url %}
                <img src="{{ branding.logo_url }}" alt="{{ branding.company_name }} logo"
                     style="max-width:240px; max-height:70px; object-fit:contain;" class="mb-2">
            {% else %}
                <div class="d-inline-flex bg-success text-white rounded-3 p-2 mb-2 align-items-center justify-content-center" style="width:44px; height:44px;">
                    <i class="bi bi-layers-fill fs-5"></i>
                </div>
            {% endif %}
            <h3 class="fw-bold text-dark mt-2 mb-1">{{ branding.company_name }}</h3>
            <p class="text-muted small">Sign in to your account</p>
        </div>

        {% if error %}
            <div class="alert alert-danger py-2 small rounded-3" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">USERNAME</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control bg-light" name="username" placeholder="Enter username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold">PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control bg-light" name="password" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-rizz w-100 py-2">Sign In</button>
        </form>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
